name: 同步 Docker Hub 简介

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/dockerhub-overview.md
      - .github/workflows/dockerhub-description.yml

permissions:
  contents: read

jobs:
  update-description:
    name: 更新 Docker Hub 仓库简介
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 更新短简介与 Overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/mediasync
          short-description: 自托管的家庭影音云盘订阅同步服务
          readme-filepath: ./docs/dockerhub-overview.md
          enable-url-completion: true
