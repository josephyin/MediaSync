name: 发布容器镜像

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 构建 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 后端镜像
            image: mediasync-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: 前端镜像
            image: mediasync-frontend
            context: .
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=rc,enable=${{ contains(github.ref_name, '-rc.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc.') }}
          labels: |
            org.opencontainers.image.title=MediaSync ${{ matrix.name }}
            org.opencontainers.image.description=MediaSync 自托管云盘影音同步服务

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
