name: 发布容器镜像

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 要从 GHCR 同步到 Docker Hub 的既有单镜像版本标签
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: 构建 MediaSync 单镜像
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/mediasync
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mediasync
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=rc,enable=${{ contains(github.ref_name, '-rc.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc.') }}
          labels: |
            org.opencontainers.image.title=MediaSync
            org.opencontainers.image.description=MediaSync 自托管云盘影音同步服务

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mediasync
          cache-to: type=gha,mode=max,scope=mediasync

      - name: 更新 Docker Hub 中文说明
        id: dockerhub-description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/mediasync
          short-description: 自托管的家庭影音云盘订阅同步服务
          readme-filepath: ./docs/dockerhub-overview.md
          enable-url-completion: true

      - name: 提示 Docker Hub 说明同步结果
        if: steps.dockerhub-description.outcome == 'failure'
        run: |
          echo "::warning::Docker Hub Overview 自动更新失败；镜像已经发布，请检查 Access Token 的仓库详情管理权限并手动同步说明。"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          release_args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "MediaSync $GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *"-rc."* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

  mirror-existing:
    name: 同步 MediaSync 单镜像
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 校验版本标签
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "无效版本标签：$VERSION"
            exit 1
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 同步版本镜像
        env:
          VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          source_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mediasync:${VERSION}"
          target_image="docker.io/${DOCKERHUB_USERNAME}/mediasync:${VERSION}"
          docker buildx imagetools create --tag "$target_image" "$source_image"

          if [[ "$VERSION" == *"-rc."* ]]; then
            docker buildx imagetools create \
              --tag "docker.io/${DOCKERHUB_USERNAME}/mediasync:rc" \
              "$source_image"
          else
            docker buildx imagetools create \
              --tag "docker.io/${DOCKERHUB_USERNAME}/mediasync:latest" \
              "$source_image"
          fi

          docker buildx imagetools inspect "$target_image"
